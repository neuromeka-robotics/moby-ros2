controller_manager:
    ros__parameters:

        update_rate: 100 # Hz

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster

        traction_motor_controller:
            type: velocity_controllers/JointGroupVelocityController

        rotation_motor_controller:
            type: position_controllers/JointGroupPositionController

        joint_trajectory_controller:
            type: joint_trajectory_controller/JointTrajectoryController

traction_motor_controller:
    ros__parameters:
        joints:
            - fl_tract_joint
            - fr_tract_joint
            - rl_tract_joint
            - rr_tract_joint
        interface_name: velocity
        command_interfaces:
            - velocity
        state_interfaces:
            - velocity
        state_publish_rate: 50.0
        velocity_rolling_window_size: 10
        cmd_vel_timeout: 0.5
        state_publish_rate: 50.0

rotation_motor_controller:
    ros__parameters:
        joints:
            - fl_rot_joint
            - fr_rot_joint
            - rl_rot_joint
            - rr_rot_joint
        interface_name: position
        command_interfaces:
            - position
        state_interfaces:
            - position
        state_publish_rate: 50.0

joint_trajectory_controller:
    ros__parameters:
        joints:
            - joint0
            - joint1
            - joint2
            - joint3
            - joint4
            - joint5
        command_interfaces:
            - position
            - velocity
        state_interfaces:
            - position
            - velocity
        state_publish_rate: 50.0
        action_monitor_rate: 20.0
        allow_partial_joints_goal: false
        allow_nonzero_velocity_at_trajectory_end: false
        constraints:
            stopped_velocity_tolerance: 0.1
            goal_time: 0.0
            joint0: { trajectory: 0.2, goal: 0.1 }
            joint1: { trajectory: 0.2, goal: 0.1 }
            joint2: { trajectory: 0.2, goal: 0.1 }
            joint3: { trajectory: 0.2, goal: 0.1 }
            joint4: { trajectory: 0.2, goal: 0.1 }
            joint5: { trajectory: 0.2, goal: 0.1 }
